<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SymbolCenterExp</title>
<style>
:root{box-sizing:border-box;--bg:#f6f6f4;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--acc:#2a5db0;--bd:#d8d8d2;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171717;--fg:#eee;--mut:#a0a09a;--card:#232323;--acc:#6b9be8;--bd:#3a3a3a}}
:root[data-theme="dark"]{--bg:#171717;--fg:#eee;--mut:#a0a09a;--card:#232323;--acc:#6b9be8;--bd:#3a3a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:1.5rem;margin:0 0 8px}h2{font-size:1.1rem;margin:0 0 8px}
p,li{color:var(--mut)}
input[type=text]{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
button{font:inherit;padding:10px 18px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer;margin:8px 8px 0 0}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.4;cursor:not-allowed}
textarea{width:100%;height:140px;font:12px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:right}th:first-child,td:first-child{text-align:left}
.item{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.item .th{width:101px;height:101px;background:#fff;border:1px solid var(--bd);flex:none;position:relative}
.item .th img{width:101px;height:101px;display:block}
.item .th i{position:absolute;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;background:#d22}
#stage{position:fixed;inset:0;background:#fff;cursor:crosshair;display:none;touch-action:none;user-select:none}
#stage img{position:absolute;width:101px;height:101px;pointer-events:none}
#mark{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;display:none}
#hud{position:absolute;left:8px;top:calc(8px + env(safe-area-inset-top,0px));font:12px system-ui;color:#999}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="intro">
  <div class="card">
    <h1>Where is the center?</h1>
    <p>A symbol will appear at a random place on the screen. Click where you think its <b>center</b> is. Do not use any aids.</p>
    <label for="pid" style="color:var(--mut)">Participant ID</label>
    <input type="text" id="pid" placeholder="e.g. P01" autocomplete="off">
    <button id="start" disabled>Start (fullscreen)</button>
  </div>
  <div class="card">
    <h2>Collected data (<span id="count">0</span> trials)</h2>
    <button class="sec" id="showRes">View results</button>
    <button class="sec" id="clear">Clear all data</button>
  </div>
</div>

<div class="wrap hide" id="results">
  <div class="card">
    <h2>Mean error by symbol (click − centroid, px)</h2>
    <div class="scroll"><table id="sum"></table></div>
    <p style="font-size:.85rem">+x = right, +y = down.</p>
  </div>
  <div class="card">
    <h2>CSV</h2>
    <textarea id="csv" readonly></textarea>
    <button id="copy">Copy CSV</button>
    <button class="sec" id="dl">Download CSV</button>
    <button class="sec" id="next">Next participant</button>
  </div>
</div>

<div id="stage"><div id="hud"></div><svg id="mark" viewBox="0 0 16 16"><path d="M2 2L14 14M14 2L2 14" stroke="#d22" stroke-width="2"/></svg></div>

<script>
const S=101, MARGIN=20, KEY="symexp_rows_v2";
const $=id=>document.getElementById(id), stage=$("stage"), mark=$("mark");
let rows=[],imgs=[]; try{rows=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}; $("count").textContent=rows.length};
save();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

// ---- image analysis: centroid of symbol region (outline + enclosed area) ----
async function addImage(name,url){
  const im=new Image(); im.src=url; await im.decode();
  const c=document.createElement("canvas"); c.width=c.height=S;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.fillStyle="#fff"; g.fillRect(0,0,S,S); g.drawImage(im,0,0,S,S);
  const d=g.getImageData(0,0,S,S).data, N=S*S, fg=new Uint8Array(N), ext=new Uint8Array(N), st=[];
  for(let i=0;i<N;i++)fg[i]=(0.299*d[4*i]+0.587*d[4*i+1]+0.114*d[4*i+2])<230?1:0;
  const push=i=>{if(!fg[i]&&!ext[i]){ext[i]=1;st.push(i)}};
  for(let k=0;k<S;k++){push(k);push((S-1)*S+k);push(k*S);push(k*S+S-1)}
  while(st.length){const i=st.pop(),x=i%S,y=(i/S)|0;
    if(x>0)push(i-1);if(x<S-1)push(i+1);if(y>0)push(i-S);if(y<S-1)push(i+S)}
  let n=0,sx=0,sy=0,x0=S,x1=-1,y0=S,y1=-1;
  for(let i=0;i<N;i++)if(!ext[i]){const x=i%S,y=(i/S)|0;n++;sx+=x+.5;sy+=y+.5;
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(!n){alert(name+": no symbol found in image.");return}
  imgs.push({name:name.replace(/\.[^.]+$/,""),url,nw:im.naturalWidth,nh:im.naturalHeight,
    cx:sx/n,cy:sy/n,bx:(x0+x1+1)/2,by:(y0+y1+1)/2,area:n});
  render();
}
function render(){ $("start").disabled=!imgs.length; }

// ---- online collection: paste your Google Apps Script web-app URL between the quotes ----
const ENDPOINT="/.netlify/functions/save";
function send(r){if(!ENDPOINT)return;try{fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(r)})}catch(e){}}

// ---- trials ----
let pid,order,t,cur,el,shownAt,busy;
$("start").onclick=async()=>{
  pid=$("pid").value.trim(); if(!pid){$("pid").focus();return}
  if(ENDPOINT){
    try{
      const r=await fetch(ENDPOINT.replace("save","join"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({participant:pid})});
      if(r.status===403){alert("Sorry, this study has reached its maximum number of participants.");return}
      if(!r.ok){alert("Could not start the experiment (server error). Please try again.");return}
    }catch(e){alert("Could not connect to the server. Check your internet connection and try again.");return}
  }
  order=shuffle(imgs); t=0;
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}
  $("intro").classList.add("hide"); stage.style.display="block";
  setTimeout(nextTrial,400);
};
function nextTrial(){
  if(t>=order.length){finish();return}
  const W=innerWidth,Hh=innerHeight, m=order[t];
  const left=rnd(MARGIN,Math.max(MARGIN,W-S-MARGIN)), top=rnd(MARGIN,Math.max(MARGIN,Hh-S-MARGIN));
  if(el)el.remove();
  el=new Image(); el.draggable=false; el.src=m.url; el.style.left=left+"px"; el.style.top=top+"px";
  stage.appendChild(el);
  cur={m,left,top,W,H:Hh}; t++;
  $("hud").textContent=`${t} / ${order.length}`; mark.style.display="none";
  shownAt=performance.now(); busy=false;
}
stage.addEventListener("pointerdown",e=>{
  if(busy||!cur||performance.now()-shownAt<250)return; busy=true;
  const m=cur.m,x=e.clientX,y=e.clientY,gx=cur.left+m.cx,gy=cur.top+m.cy,bx=cur.left+m.bx,by=cur.top+m.by;
  rows.push({participant:pid,trial:t,shape:m.name,screen_w:cur.W,screen_h:cur.H,dpr:devicePixelRatio,
    box_left:cur.left,box_top:cur.top,bbox_cx:+bx.toFixed(2),bbox_cy:+by.toFixed(2),centroid_x:+gx.toFixed(2),centroid_y:+gy.toFixed(2),
    click_x:x,click_y:y,click_screen_x:e.screenX,click_screen_y:e.screenY,center_screen_x:+(gx+e.screenX-x).toFixed(2),center_screen_y:+(gy+e.screenY-y).toFixed(2),dx_centroid:+(x-gx).toFixed(2),dy_centroid:+(y-gy).toFixed(2),
    dx_bbox:+(x-bx).toFixed(2),dy_bbox:+(y-by).toFixed(2),rt_ms:Math.round(performance.now()-shownAt)});
  save(); send(rows[rows.length-1]);
  mark.style.left=x+"px";mark.style.top=y+"px";mark.style.display="block";
  setTimeout(()=>{mark.style.display="none";if(el){el.remove();el=null}cur=null;setTimeout(nextTrial,500)},350);
});
function finish(){
  stage.style.display="none";
  try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
  showResults();
}
function showResults(){
  $("intro").classList.add("hide");$("results").classList.remove("hide");
  const cols=["participant","trial","shape","screen_w","screen_h","dpr","box_left","box_top","bbox_cx","bbox_cy","centroid_x","centroid_y","click_x","click_y","click_screen_x","click_screen_y","center_screen_x","center_screen_y","dx_centroid","dy_centroid","dx_bbox","dy_bbox","rt_ms"];
  $("csv").value=[cols.join(",")].concat(rows.map(r=>cols.map(c=>r[c]).join(","))).join("\n");
  let h="<tr><th>Symbol</th><th>n</th><th>mean dx</th><th>mean dy</th></tr>";
  [...new Set(rows.map(r=>r.shape))].forEach(s=>{const r=rows.filter(x=>x.shape===s),n=r.length,m=k=>(r.reduce((a,b)=>a+b[k],0)/n).toFixed(2);
    h+=`<tr><td>${s}</td><td>${n}</td><td>${m("dx_centroid")}</td><td>${m("dy_centroid")}</td></tr>`});
  $("sum").innerHTML=h;
}
$("showRes").onclick=showResults;
$("next").onclick=()=>{$("results").classList.add("hide");$("intro").classList.remove("hide");$("pid").value=""};
$("copy").onclick=()=>{const ta=$("csv");ta.select();try{navigator.clipboard.writeText(ta.value).catch(()=>document.execCommand("copy"))}catch(e){document.execCommand("copy")}$("copy").textContent="Copied"; setTimeout(()=>$("copy").textContent="Copy CSV",1200)};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("csv").value],{type:"text/csv"}));a.download="symbol-center-results.csv";document.body.appendChild(a);a.click();a.remove()};
$("clear").onclick=()=>{if(confirm("Delete all collected data on this browser?")){rows=[];save()}};
</script>
